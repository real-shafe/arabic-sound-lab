<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arabic Sound Lab</title>
<meta name="description" content="Train your ear for the Arabic sounds English doesn't have: hear a word, pick which one it was, and see where in the mouth each sound is made. Synthetic speech in two voices.">
<link rel="canonical" href="https://arabic-sound-lab.shafe.dev/">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#17181b">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Arabic Sound Lab">
<meta property="og:title" content="Arabic Sound Lab">
<meta property="og:description" content="Train your ear for the Arabic sounds English doesn't have, and see where in the mouth each one is made.">
<meta property="og:url" content="https://arabic-sound-lab.shafe.dev/">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="https://arabic-sound-lab.shafe.dev/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Arabic Sound Lab: two Arabic words that differ by one sound, and a diagram of the mouth marking where each sound is made">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/mouth.css">
<link rel="stylesheet" href="css/offline.css">

<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/text.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="data.js">
<link rel="modulepreload" href="js/mouth.js">
<link rel="modulepreload" href="js/sounds.js">
<link rel="modulepreload" href="js/views.js">
<script type="module" src="js/app.js"></script>
</head>
<body data-mode="pairs">
<div class="stage">
  <h1>Arabic Sound Lab<span lang="ar" dir="rtl">أصوات</span></h1>

  <div class="bar">
    <div class="modes" role="group" aria-label="Activity">
      <button type="button" data-mode="pairs" aria-pressed="true">Ear quiz</button>
      <button type="button" data-mode="place" aria-pressed="false">Mouth quiz</button>
      <button type="button" data-mode="browse" aria-pressed="false">All sounds</button>
    </div>
  </div>

  <!-- The two quizzes: a card and the picture under it. app.js builds each quiz's parts once. -->
  <section class="card" id="card" data-answered="false" aria-label="Question"></section>
  <div class="surface" id="surface"></div>

  <!-- All sounds: the list first, the chosen sound right under it (a sheet on phones). -->
  <div class="picker" id="picker" data-ui="picker" role="group" aria-label="All sounds, from the lips to the voice box"></div>
  <p class="tip" id="tip"></p>
  <section class="detail" id="detail" aria-label="The chosen sound"></section>

  <!-- After the activities for the keyboard, drawn in the title row: the quiz comes first. -->
  <div class="prefs">
    <label title="Synthetic speech made with ElevenLabs; not checked by a fluent speaker"><span class="pref-label">AI voice</span> <select id="voice" aria-label="AI voice"><option value="mix">Both voices</option><option value="chaouki">Male voice</option><option value="asmaa">Female voice</option></select></label>
    <label><input type="checkbox" id="slow"> Slow</label>
  </div>

  <!-- Shown under All sounds only. It is inside the stage so that the pinned list stays pinned to the end of the page. -->
  <footer>
    <p>The audio is synthetic speech made with ElevenLabs in two voices, Chaouki and Asmaa. It has not been checked by a fluent Arabic speaker; recordings of real people, such as those on <a href="https://forvo.com/languages/ar/" target="_blank" rel="noopener">Forvo</a>, remain the best reference.</p>
    <p><button type="button" class="linkish" data-ref="notes">Reading notes: the small marks, spelling, regional speech and sources</button></p>
    <div id="offline-root"></div>
    <p><a href="https://github.com/real-shafe/arabic-sound-lab" target="_blank" rel="noopener">Source code</a> · <a href="https://shafe.dev">shafe.dev</a></p>
  </footer>
</div>

<dialog class="sheet" id="sheet" data-ui="sheet" aria-label="About this sound">
  <div class="sheet-head">
    <button type="button" class="sheet-btn" data-ui="sheet-prev" aria-label="Previous sound" title="Previous sound">‹</button>
    <button type="button" class="sheet-btn" data-ui="sheet-next" aria-label="Next sound" title="Next sound">›</button>
    <span class="grow" id="sheet-pos"></span>
    <button type="button" class="sheet-btn" data-ui="sheet-close" aria-label="Close" title="Close (Esc)">✕</button>
  </div>
  <div class="sheet-body" id="sheet-body" tabindex="-1"></div>
</dialog>

<div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<noscript><p class="noscript">This page needs JavaScript to play sounds.</p></noscript>
</body>
</html>
